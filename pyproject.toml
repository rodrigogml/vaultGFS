[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultGFS"
version = "1.1.2"
description = "Configurable GFS-oriented backup utility for filesystems and databases"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "vaultGFS contributors"}]

[project.scripts]
vaultgfs-backup = "vaultgfs.cli_backup:main"
vaultgfs-prune = "vaultgfs.cli_prune:main"
vaultgfs-reload = "vaultgfs.cli_reload:main"
vaultgfs-restore = "vaultgfs.cli_restore:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
